<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HØK — Heart of Khaos</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #050505;
    color: white;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
}

/* Background glow */
body::before {
    content: "";
    position: fixed;
    width: 500px;
    height: 500px;
    background: #8b001f;
    filter: blur(180px);
    opacity: 0.18;
    top: 20%;
    left: 50%;
    transform: translateX(-50%);
    pointer-events: none;
}

/* Navigation */
nav {
    position: fixed;
    top: 0;
    width: 100%;
    padding: 25px 35px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 10;
    background: rgba(5,5,5,0.65);
    backdrop-filter: blur(10px);
}

.logo {
    font-size: 25px;
    font-weight: bold;
    letter-spacing: 5px;
    color: #b0002a;
}

nav a {
    color: #aaa;
    text-decoration: none;
    margin-left: 20px;
    font-size: 13px;
    transition: 0.3s;
}

nav a:hover {
    color: #ff1744;
}

/* Hero */
.hero {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 100px 20px;
}

.small-title {
    color: #b0002a;
    letter-spacing: 8px;
    font-size: 12px;
    margin-bottom: 20px;
}

h1 {
    font-size: clamp(80px, 20vw, 190px);
    letter-spacing: 15px;
    line-height: 0.9;
    text-shadow: 0 0 40px rgba(180,0,40,0.35);
}

.subtitle {
    margin-top: 30px;
    color: #999;
    letter-spacing: 6px;
    font-size: 13px;
}

.enter {
    margin-top: 45px;
    padding: 15px 35px;
    border: 1px solid #8b0025;
    color: white;
    text-decoration: none;
    letter-spacing: 4px;
    font-size: 12px;
    transition: 0.3s;
}

.enter:hover {
    background: #8b0025;
    box-shadow: 0 0 30px rgba(180,0,40,0.4);
}

/* Sections */
section {
    min-height: 80vh;
    padding: 120px 10%;
    border-top: 1px solid #151515;
}

.section-title {
    color: #b0002a;
    letter-spacing: 5px;
    font-size: 13px;
    margin-bottom: 25px;
}

section h2 {
    font-size: clamp(35px, 7vw, 70px);
    margin-bottom: 25px;
}

section p {
    max-width: 650px;
    color: #888;
    line-height: 1.9;
    font-size: 16px;
}

.links {
    margin-top: 40px;
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
}

.links a {
    border: 1px solid #222;
    padding: 15px 25px;
    color: #aaa;
    text-decoration: none;
    transition: 0.3s;
}

.links a:hover {
    border-color: #b0002a;
    color: white;
}

footer {
    padding: 40px;
    text-align: center;
    border-top: 1px solid #151515;
    color: #555;
    font-size: 11px;
    letter-spacing: 3px;
}
/* HØK — CHAOS EFFECT */
.hero h1 {
  text-shadow:
    0 0 10px rgba(255, 0, 45, 0.45),
    0 0 30px rgba(255, 0, 45, 0.25);
  animation: hokPulse 3s ease-in-out infinite;
}

.hero .small-title {
  text-shadow: 0 0 12px rgba(255, 0, 45, 0.5);
  animation: titleFade 2s ease-in-out infinite alternate;
}

.hero .subtitle {
  letter-spacing: 6px;
  text-shadow: 0 0 12px rgba(255, 255, 255, 0.25);
}

.enter {
  position: relative;
  overflow: hidden;
  box-shadow: 0 0 0 rgba(255, 0, 45, 0);
}

.enter::before {
  content: "";
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: rgba(255, 0, 45, 0.15);
  transition: 0.5s;
}

.enter:hover::before {
  left: 100%;
}

.enter:hover {
  box-shadow:
    0 0 15px rgba(255, 0, 45, 0.35),
    0 0 35px rgba(255, 0, 45, 0.15);
  transform: translateY(-2px);
}

@keyframes hokPulse {
  0%, 100% {
    text-shadow:
      0 0 10px rgba(255, 0, 45, 0.35),
      0 0 30px rgba(255, 0, 45, 0.15);
  }

  50% {
    text-shadow:
      0 0 18px rgba(255, 0, 45, 0.65),
      0 0 45px rgba(255, 0, 45, 0.3);
  }
}

@keyframes titleFade {
  from {
    opacity: 0.65;
  }

  to {
    opacity: 1;
  }
    /* HØK — SHOP DESIGN */

.shop {
  text-align: center;
  padding: 80px 20px 60px;
}

.shop h1 {
  font-size: clamp(80px, 18vw, 180px);
  letter-spacing: 12px;
  margin: 15px 0 5px;
}

.products {
  max-width: 1100px;
  margin: 70px auto 0;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 25px;
}

.product {
  border: 1px solid rgba(255, 0, 45, 0.25);
  padding: 18px;
  background: rgba(255, 0, 45, 0.025);
  transition: 0.3s ease;
}

.product:hover {
  border-color: rgba(255, 0, 45, 0.7);
  transform: translateY(-6px);
  box-shadow: 0 15px 40px rgba(255, 0, 45, 0.12);
}

.product-box {
  height: 260px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #090909;
  border: 1px solid rgba(255, 255, 255, 0.08);
  font-size: 28px;
  letter-spacing: 5px;
  color: rgba(255,255,255,0.8);
}

.product h2 {
  font-size: 18px;
  margin: 22px 0 8px;
  letter-spacing: 2px;
}

.product p {
  font-size: 11px;
  letter-spacing: 3px;
  color: #ff002d;
}

.bottom {
  max-width: 1100px;
  margin: 80px auto 0;
  padding: 50px 20px;
  border-top: 1px solid rgba(255,255,255,0.08);
}

.bottom-links {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 80px;
}

.bottom .links,
.bottom .about {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.section-title {
  color: #ff002d;
  font-size: 11px;
  letter-spacing: 3px;
  margin-bottom: 10px;
}

.bottom a {
  color: #fff;
  text-decoration: none;
  letter-spacing: 2px;
  font-size: 13px;
  transition: 0.25s;
}

.bottom a:hover {
  color: #ff002d;
  padding-left: 5px;
}

.about h2 {
  font-size: 20px;
  letter-spacing: 2px;
  margin: 0;
}

.about p {
  max-width: 400px;
  line-height: 1.8;
  color: rgba(255,255,255,0.55);
  font-size: 14px;
}

@media (max-width: 700px) {
  .products {
    grid-template-columns: 1fr;
  }

  .product-box {
    height: 220px;
  }

  .bottom-links {
    grid-template-columns: 1fr 1fr;
    gap: 25px;
  }

  .shop {
    padding-top: 55px;
  }
}
   /* HØK — PRODUCT CARDS */

.products {
  max-width: 1100px;
  margin: 60px auto 0;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 25px;
}

.product {
  padding: 20px;
  border: 1px solid rgba(255, 0, 45, 0.25);
  background: rgba(255, 255, 255, 0.02);
  transition: 0.3s ease;
}

.product:hover {
  transform: translateY(-8px);
  border-color: rgba(255, 0, 45, 0.7);
  box-shadow: 0 0 30px rgba(255, 0, 45, 0.15);
}

.product-box {
  height: 260px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #090909;
  border: 1px solid rgba(255, 255, 255, 0.08);
  color: rgba(255, 255, 255, 0.8);
  font-size: 28px;
  letter-spacing: 5px;
}

.product h2 {
  margin: 20px 0 8px;
  font-size: 22px;
  letter-spacing: 2px;
}

.product p {
  margin: 0;
  color: rgba(255, 0, 45, 0.8);
  font-size: 12px;
  letter-spacing: 3px;
}

/* MOBILE */

@media (max-width: 700px) {

  .products {
    grid-template-columns: 1fr;
    margin-top: 40px;
    padding: 0 20px;
  }

  .product-box {
    height: 220px;
  }

} 
}</style>
</head>

<body>
<main>

<section class="shop">

    <div class="small-title">WELCOME TO THE CHAOS</div>

    <h1>HØK</h1>

    <div class="subtitle">HEART OF KHAOS</div>

    <div class="products">

        <div class="product">
            <div class="product-box">CAP</div>
            <h2>HØK CAP</h2>
            <p>COMING SOON</p>
        </div>

        <div class="product">
            <div class="product-box">TEE</div>
            <h2>HØK T-SHIRT</h2>
            <p>COMING SOON</p>
        </div>

        <div class="product">
            <div class="product-box">HOODIE</div>
            <h2>HØK HOODIE</h2>
            <p>COMING SOON</p>
        </div>

    </div>

</section>

<section class="bottom">

    <div class="bottom-links">

        <div class="links">
            <div class="section-title">01 — LINKS</div>
            <a href="#">TIKTOK</a>
            <a href="#">INSTAGRAM</a>
            <a href="#">YOUTUBE</a>
        </div>

        <div class="about">
            <div class="section-title">02 — ABOUT</div>
            <h2>HØK — HEART OF KHAOS</h2>
            <p>
                HØK is a streetwear brand built around darkness,
                individuality and chaos.
            </p>
        </div>

    </div>

</section>

</main>

<footer>
    HØK — HEART OF KHAOS
</footer>

</body>
</html>
